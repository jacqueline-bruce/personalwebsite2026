<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./dist/output.css"/> <!-- the output file provides the css styling -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400&display=swap" rel="stylesheet"> <!-- satoshi font -->
    <title>Jacqueline's Portfolio</title>
    <link rel="icon" type="./img/strawb.png" href="./img/strawb.png">
  </head>
  <body class="font-satoshi bg-white">
    
    <!-- navbar -->
    <nav class="w-full fixed top-0 left-0 bg-white z-50 border-b border-gray-100">
        <div class="container mx-auto py-4 flex flex-col items-center justify-center px-4">
            <div class="flex items-center justify-center w-full pb-4">
                <img src="./img/signature.png" alt="signature" class="w-auto h-16 object-contain">
            </div>
            <ul class="flex space-x-16 text-gray-600 uppercase text-xs tracking-wider justify-center w-full font-medium">
                <li class="hover:text-black transition-colors">
                    <a href="index.html">Artwork</a>
                </li>
                <li class="hover:text-black transition-colors">
                    <a href="about.html">About me</a>
                </li>
                <li class="hover:text-black transition-colors">
                    <a href="contact.html">Contact</a>
                </li>
            </ul>        
        </div>
    </nav>

    <!-- Contact Form Section -->
    <main class="container mx-auto px-6 pt-44 pb-20">
        <h1 class="text-3xl font-bold text-center mb-2 tracking-tight text-gray-900">Contact Me</h1>
        <p class="text-center mb-10 text-gray-500 text-sm">Feel free to reach out!</p>
        
        <!-- FUNCTIONAL FORM -->
        <!-- Step 1: Replace YOUR_UNIQUE_KEY with your Formspree endpoint ID -->
        <form action="https://formspree.io/f/mkjokjjq" method="POST" class="max-w-md mx-auto flex flex-col gap-5">
            
            <!-- FIX: This hidden input tells Formspree where to send users after they click submit -->
            <!-- RETURN TO THIS - doesn't work properly yet -->
            <input type="hidden" name="_next" value="https://jacquelinebruce.com/thanks.html">

            <div>
                <label for="name" class="block text-gray-700 text-sm font-medium mb-2">Name</label>
                <!-- Added name="name" and required -->
                <input type="text" id="name" name="name" required class="appearance-none border border-gray-200 rounded-lg w-full py-2.5 px-3.5 text-gray-700 leading-tight focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-all">
            </div>
            
            <div>
                <label for="email" class="block text-gray-700 text-sm font-medium mb-2">Email</label>
                <!-- Added name="email" and required -->
                <input type="email" id="email" name="email" required class="appearance-none border border-gray-200 rounded-lg w-full py-2.5 px-3.5 text-gray-700 leading-tight focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-all">
            </div>
            
            <div>
                <label for="message" class="block text-gray-700 text-sm font-medium mb-2">Message</label>
                <!-- Added name="message" and required -->
                <textarea id="message" name="message" rows="5" required class="appearance-none border border-gray-200 rounded-lg w-full py-2.5 px-3.5 text-gray-700 leading-tight focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-all resize-none"></textarea>
            </div>
            
            <button type="submit" class="w-full bg-black hover:bg-gray-800 text-white font-medium py-3 px-4 rounded-xl transition-colors focus:outline-none text-sm tracking-wide uppercase mt-2">
                Send Message
            </button>
            
        </form>
    </main>

  </body>
</html>
